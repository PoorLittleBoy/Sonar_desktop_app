services:
  eslint:
    image: node:24-alpine
    working_dir: /build
    volumes:
      - .:/build
    command: >
      sh -c "npm install --save-dev eslint @eslint/js typescript typescript-eslint eslint-plugin-vue vue-eslint-parser globals &&
             npx eslint ."

  clippy:
    image: rust:1.96.0
    working_dir: /build/src-tauri
    volumes:
      - .:/build
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/build/src-tauri/target
    command: >
      sh -c "apt-get update &&
             apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config &&
             rustup component add clippy &&
             cargo clippy --all-targets --all-features"

volumes:
  cargo-registry:
  cargo-target: