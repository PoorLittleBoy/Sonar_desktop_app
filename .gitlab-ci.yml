stages:
  - lint
  - build
  - test

eslint:
  stage: lint
  image: node:24-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npx eslint .

clippy:
  stage: lint
  image: gitlab.erdtcyber.com:5050/erdt-cyber/sonar:rust-clippy
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry
      - target/
  script:
      - cd ./src-tauri
      - cargo clippy --all-targets --all-features
