stages:
  - lint
  - build
  - test

build-ci-image:
  stage: .pre
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - source ./config/build-versions.env
    - IMAGE_TAG=$(cat .env Dockerfile.ci | sha256sum | cut -c1-16)
    - IMAGE="${CI_REGISTRY_IMAGE}/ci-base:${IMAGE_TAG}"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
        echo "Image déjà présente (${IMAGE_TAG}), pas de rebuild."
      else
        docker build \
          --build-arg RUST_IMAGE_DIGEST="${RUST_IMAGE_DIGEST}" \
          --build-arg LINUX_APT_PACKAGES="${LINUX_APT_PACKAGES}" \
          --build-arg DEBIAN_SNAPSHOT_BASE_URL="${DEBIAN_SNAPSHOT_BASE_URL}" \
          --build-arg APT_SNAPSHOT_TIMESTAMP="${APT_SNAPSHOT_TIMESTAMP}" \
          --build-arg DENO_VERSION="${DENO_VERSION}" \
          -f Dockerfile.ci \
          -t "${IMAGE}" .
        docker push "${IMAGE}"
      fi
    - echo "CI_BASE_IMAGE=${IMAGE}" > build.env
  artifacts:
    reports:
      dotenv: build.env

eslint:
  stage: lint
  image: node:24-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npx eslint .

clippy:
  stage: lint
  image: gitlab.erdtcyber.com:5050/erdt-cyber/sonar:rust-clippy
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry
      - target/
  script:
      - cd ./src-tauri
      - cargo clippy --all-targets --all-features

build:
  stage: build
  needs:
    - job: build-ci-image
      artifacts: true
  image: "${CI_BASE_IMAGE}"
  cache:
    - key: { files: [deno.lock] }
      paths: [.deno_cache/]
    - key: { files: [Cargo.lock] }
      paths: [.cargo/registry/, target/]
  script:
    - deno install
    - cargo tauri build
