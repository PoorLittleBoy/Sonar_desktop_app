stages:
  - lint
  - tests
  - build

eslint:
  stage: lint
  image: node:24-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
  before_script:
    - npm install --save-dev eslint @eslint/js typescript typescript-eslint eslint-plugin-vue vue-eslint-parser globals
  script:
    - npx eslint .

clippy:
  stage: lint
  image: rust:1.96.0
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry
      - target/
  before_script:
    - apt-get update
    - apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config
    - rustup component add clippy
  script:
      - cd ./src-tauri
      - cargo clippy --all-targets --all-features
