stages:
  - lint
  - build
  - test

# ---------------------------------------------------------------------------
# Build (ou réutilisation en cache) de l'image CI de base, via Podman rootless.
# Remplace l'ancien job Kaniko : mêmes variables, même logique de hash,
# même registre. Le smoke-test de la toolchain est déplacé dans un job
# dédié (test-ci-image) pour tourner même quand l'image est déjà en cache.
# ---------------------------------------------------------------------------
build-ci-image:
  stage: .pre
  image: quay.io/podman/stable
  tags:
    - rust-heavy
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
  before_script:
    - mkdir -p "/etc/containers/certs.d/${CI_REGISTRY}"
    - cp "$ERDT_CA_CERT" "/etc/containers/certs.d/${CI_REGISTRY}/ca.crt"
    - podman login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
  script:
    - . ./config/build-versions.env
    - IMAGE_TAG=$(cat ./config/build-versions.env Dockerfile.ci | sha256sum | cut -c1-16)
    - IMAGE="${CI_REGISTRY_IMAGE}/ci-base:${IMAGE_TAG}"
    - |
      if podman pull "${IMAGE}" > /dev/null 2>&1; then
        echo "Image déjà présente (${IMAGE_TAG}), pas de rebuild."
      else
        podman build \
          --file Dockerfile.ci \
          --build-arg UBUNTU_IMAGE_DIGEST="${UBUNTU_IMAGE_DIGEST}" \
          --build-arg LINUX_APT_PACKAGES="${LINUX_APT_PACKAGES}" \
          --build-arg APT_SNAPSHOT_TIMESTAMP="${APT_SNAPSHOT_TIMESTAMP}" \
          --build-arg DENO_VERSION="${DENO_VERSION}" \
          --build-arg RUST_VERSION="${RUST_VERSION}" \
          --tag "${IMAGE}" \
          .
        podman push "${IMAGE}"
      fi
    - echo "CI_BASE_IMAGE=${IMAGE}" > build.env
  artifacts:
    reports:
      dotenv: build.env
  # Cache des layers Podman entre pipelines (équivalent du --cache-repo Kaniko).
  # Optionnel : à activer si le stockage local sur les runners rust-heavy
  # persiste bien entre jobs (sinon aucun effet, juste un no-op).
  cache:
    key: podman-layers
    paths:
      - .containers-storage/

# ---------------------------------------------------------------------------
# Vérifie que l'image CI de base est réellement utilisable, systématiquement
# (même si build-ci-image a juste réutilisé le cache sans rebuild).
# ---------------------------------------------------------------------------
test-ci-image:
  stage: .pre
  image: quay.io/podman/stable
  needs:
    - build-ci-image
  tags:
    - rust-heavy
  variables:
    STORAGE_DRIVER: vfs
  before_script:
    - mkdir -p "/etc/containers/certs.d/${CI_REGISTRY}"
    - cp "$ERDT_CA_CERT" "/etc/containers/certs.d/${CI_REGISTRY}/ca.crt"
    - podman login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - podman pull "${CI_BASE_IMAGE}"
  script:
    - |
      podman run --rm "${CI_BASE_IMAGE}" bash -lc '
        set -e
        echo "=== TOOLCHAIN ==="
        rustc --version
        cargo --version
        deno --version

        echo "=== APT PACKAGES ==="
        dpkg-query -W -f="\${Package}\t\${Version}\n" \
          ca-certificates \
          curl \
          unzip \
          build-essential \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf \
          libpcap-dev \
          2>/dev/null || true

        echo "=== OS / ARCH ==="
        uname -a
        dpkg --print-architecture
        cat /etc/os-release
      '

eslint:
  rules:
      - if: '$CI_PIPELINE_SOURCE == "web"'
  stage: lint
  image: node:24.15.0-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npx eslint .

clippy:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  stage: lint
  tags:
    - rust-heavy
  image: gitlab.erdtcyber.com:5050/erdt-cyber/sonar:rust-clippy
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key:
      files:
        - src-tauri/Cargo.lock
    paths:
      - .cargo/registry
      - src-tauri/target/
  script:
    - cd ./src-tauri
    - cargo clippy --all-targets --all-features -- -D warnings

build:
  stage: build
  tags:
    - rust-heavy
  image: "${CI_BASE_IMAGE}"
  needs:
    - build-ci-image
    - test-ci-image
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    DENO_DIR: "$CI_PROJECT_DIR/.deno_cache"
  cache:
    - key: { files: [deno.lock] }
      paths: [.deno_cache/]
    - key: { files: [Cargo.lock] }
      paths: [.cargo/registry/, src-tauri/target/]
  script:
    - deno install --frozen
    - deno run -A ./security/repro-env.ts run bash -lc 'deno task tauri build --ci --no-sign'
    - ./script/package-deb-repro.sh src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/deb/*.deb
    - echo "=== DEB SHA256 ==="
          sha256sum sonar.deb
  artifacts:
    name: "sonar-${CI_COMMIT_SHORT_SHA}"
    when: always
    paths:
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/rpm/*.rpm
      - repro-hashes.txt
    expire_in: 7 days