stages:
  - lint
  - tests
  - build

eslint:
  stage: lint
  image: node:24.18.0-alpine3.24
  before_script:
   - npm install --save-dev eslint @eslint/js typescript typescript-eslint eslint-plugin-vue vue-eslint-parser globals
  script:
   - npx eslint .

clippy:
  stage: lint
  image: rust:1.97.1
  cache:
    key:
      files:
        - 
    paths:
      - .cargo/registry
      - target/
  script:
      - rustup component add clippy
      - cargo clippy --all-targets --all-features
