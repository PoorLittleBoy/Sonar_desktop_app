stages:
  - lint
  - build
  - test

build-ci-image:
  stage: .pre
  image:
    name: ghcr.io/osscontainertools/kaniko:v1.28.1-debug
    entrypoint: [""]
  before_script:  
    - cp "$ERDT_CA_CERT" /kaniko/ssl/certs/erdtcyber-CA.crt
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - . ./config/build-versions.env
    - IMAGE_TAG=$(cat ./config/build-versions.env Dockerfile.ci | sha256sum | cut -c1-16)
    - IMAGE="${CI_REGISTRY_IMAGE}/ci-base:${IMAGE_TAG}"
    - |
      if curl --fail \
        -u "${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}" \
        "https://${CI_REGISTRY}/v2/${CI_PROJECT_PATH}/ci-base/manifests/${IMAGE_TAG}" \
        > /dev/null 2>&1
      then
        echo "Image déjà présente (${IMAGE_TAG}), pas de rebuild."
      else
        /kaniko/executor \
          --context "${CI_PROJECT_DIR}" \
          --dockerfile "${CI_PROJECT_DIR}/Dockerfile.ci" \
          --destination "${IMAGE}" \
          --build-arg UBUNTU_IMAGE_DIGEST="${UBUNTU_IMAGE_DIGEST}" \
          --build-arg LINUX_APT_PACKAGES="${LINUX_APT_PACKAGES}" \
          --build-arg APT_SNAPSHOT_TIMESTAMP="${APT_SNAPSHOT_TIMESTAMP}" \
          --build-arg DENO_VERSION="${DENO_VERSION}" \
          --build-arg RUST_VERSION="${RUST_VERSION}" \
          --cache=true \
          --cache-repo="${CI_REGISTRY_IMAGE}/cache"
      fi
    - echo "CI_BASE_IMAGE=${IMAGE}" > build.env
  artifacts:
    reports:
      dotenv: build.env

eslint:
  rules:
      - if: '$CI_PIPELINE_SOURCE == "web"'
  stage: lint
  image: node:24.15.0-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npx eslint .

clippy:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  stage: lint
  tags:
    - rust-heavy
  image: gitlab.erdtcyber.com:5050/erdt-cyber/sonar:rust-clippy
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key:
      files:
        - src-tauri/Cargo.lock
    paths:
      - .cargo/registry
      - src-tauri/target/
  script:
    - cd ./src-tauri
    - cargo clippy --all-targets --all-features -- -D warnings

build:
  stage: build
  tags:
    - rust-heavy
  image: "${CI_BASE_IMAGE}"
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    DENO_DIR: "$CI_PROJECT_DIR/.deno_cache"
  cache:
    - key: { files: [deno.lock] }
      paths: [.deno_cache/]
    - key: { files: [Cargo.lock] }
      paths: [.cargo/registry/, src-tauri/target/]
  script:
    - deno install --frozen
    - deno run -A ./security/repro-env.ts run bash -lc 'deno task tauri build --ci --no-sign'
    - ./script/package-deb-repro.sh src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/deb/*.deb
    - |
      echo "=== APT PACKAGES ==="
      dpkg-query -W -f='${Package}\t${Version}\n' \
        ca-certificates \
        curl \
        unzip \
        build-essential \
        libwebkit2gtk-4.1-dev \
        libappindicator3-dev \
        librsvg2-dev \
        patchelf \
        libpcap-dev \
        2>/dev/null || true
  artifacts:
    name: "sonar-${CI_COMMIT_SHORT_SHA}"
    paths: 
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/rpm/*.rpm
    expire_in: 7 days